name: SouWen clean wheel smoke
description: Probe one wheel install shape in an isolated virtual environment

inputs:
  python:
    description: Python executable from the isolated virtual environment
    required: true
  profile:
    description: Installed package shape
    required: true
  candidate-sha:
    description: Candidate source SHA that produced the wheel
    required: true
  report-json:
    description: Machine-readable evidence output path
    required: true
  freeze-report:
    description: pip freeze output path
    required: true

runs:
  using: composite
  steps:
    - name: Probe isolated wheel runtime
      shell: bash
      env:
        CLEAN_WHEEL_PYTHON: ${{ inputs.python }}
        CLEAN_WHEEL_PROFILE: ${{ inputs.profile }}
        CLEAN_WHEEL_CANDIDATE_SHA: ${{ inputs.candidate-sha }}
        CLEAN_WHEEL_REPORT_JSON: ${{ inputs.report-json }}
        CLEAN_WHEEL_FREEZE_REPORT: ${{ inputs.freeze-report }}
      run: |
        "$CLEAN_WHEEL_PYTHON" - <<'PY'
        import importlib
        import importlib.resources
        import importlib.util
        import hashlib
        import json
        import os
        import subprocess
        import sys
        from pathlib import Path

        profile = os.environ["CLEAN_WHEEL_PROFILE"]
        candidate_sha = os.environ["CLEAN_WHEEL_CANDIDATE_SHA"]
        report_path = Path(os.environ["CLEAN_WHEEL_REPORT_JSON"])
        freeze_path = Path(os.environ["CLEAN_WHEEL_FREEZE_REPORT"])
        checks: list[dict[str, str]] = []

        def require(condition: bool, name: str, detail: str) -> None:
            checks.append(
                {"name": name, "status": "PASS" if condition else "FAIL", "detail": detail}
            )
            if not condition:
                raise RuntimeError(f"{name}: {detail}")

        def find_spec(name: str) -> bool:
            try:
                return importlib.util.find_spec(name) is not None
            except (ImportError, ModuleNotFoundError, ValueError):
                return False

        report_path.parent.mkdir(parents=True, exist_ok=True)
        freeze_path.parent.mkdir(parents=True, exist_ok=True)
        freeze = subprocess.check_output([sys.executable, "-m", "pip", "freeze"], text=True)
        freeze_path.write_text(freeze, encoding="utf-8")

        import souwen

        require(bool(souwen.__version__), "package/version", souwen.__version__)
        require(find_spec("souwen.providers.catalog"), "package/provider-catalog", "module importable")
        require(
            find_spec("souwen.common_runtime.observability"),
            "package/runtime-provenance",
            "module importable",
        )

        panel = importlib.resources.files("souwen.server").joinpath("panel.html")
        require(panel.is_file(), "package/panel", str(panel))
        require(panel.read_text(encoding="utf-8").strip() != "", "package/panel-nonempty", "nonempty")

        retired = (
            "souwen.facade",
            "souwen.fetch",
            "souwen.scraper",
            "souwen.source_registry",
            "souwen.http_client",
            "souwen.registry",
            "souwen.core",
            "souwen.paper",
            "souwen.patent",
            "souwen.web",
            "souwen.book",
            "souwen.research_output",
            "souwen.local_catalog",
            "souwen.llm",
            "souwen.search",
            "souwen.models",
            "souwen.provenance",
        )
        leaked = [name for name in retired if find_spec(name)]
        require(not leaked, "package/no-retired-imports", f"leaked={leaked}")

        if profile == "sdk-default":
            from souwen import AsyncSouWenClient, SouWenClient
            from souwen.delivery.client_sdk import OPENAPI_SHA256, SUPPORTED_API_MAJOR

            require(SouWenClient.__name__ == "SouWenClient", "sdk/sync-client", "importable")
            require(
                AsyncSouWenClient.__name__ == "AsyncSouWenClient",
                "sdk/async-client",
                "importable",
            )
            require(SUPPORTED_API_MAJOR == 2, "sdk/api-major", str(SUPPORTED_API_MAJOR))
            canonical_openapi = Path("contracts/openapi/souwen-openapi-2.0.0rc5.json")
            expected_openapi_sha256 = hashlib.sha256(canonical_openapi.read_bytes()).hexdigest()
            require(
                OPENAPI_SHA256 == expected_openapi_sha256,
                "sdk/openapi-sha256",
                OPENAPI_SHA256,
            )
            sdk_client = SouWenClient("http://127.0.0.1:49265")
            sdk_client.close()
            require(not find_spec("fastapi"), "sdk/no-fastapi", "fastapi absent")
        else:
            from souwen.server.app import app

            require(app is not None, "server/import", type(app).__name__)
            for module in ("fastapi", "uvicorn", "curl_cffi", "trafilatura", "protego"):
                require(find_spec(module), f"server/import-{module}", "module importable")

        if profile == "provider-newspaper":
            require(find_spec("newspaper"), "provider/import-newspaper", "module importable")
        elif profile == "provider-readability":
            require(find_spec("readability"), "provider/import-readability", "module importable")

        payload = {
            "schema_version": 1,
            "script": "github-composite/clean-wheel-smoke",
            "overall": "PASS",
            "candidate_sha": candidate_sha,
            "profile": profile,
            "python": sys.version,
            "checks": checks,
        }
        report_path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
        PY
