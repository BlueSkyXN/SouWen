# 镜像发布（SPEC 8）：workflow_dispatch 手动触发，按指定 SHA 构建根镜像验证、
# 并把该 SHA 的源码同步到 HFS Space。需要 HF secret（HFS_TOKEN / HFS_SPACE vars），
# 会改动线上 Space——首次运行须业主监督。本文件只写不跑（执行者未运行部署）。
#
# SHA 对应关系：整个流程 checkout 输入的 souwen_ref（默认 HEAD），镜像构建、
# Space 同步与 SOUWEN_REF 注入都来自同一个 checkout，三者一致；非当前 SHA 的
# 情况由 checkout 步骤显式校验（rev-parse HEAD 必须等于选定 SHA）。

name: image

on:
  workflow_dispatch:
    inputs:
      souwen_ref:
        description: "要发布的 40 位 commit SHA（默认取当前 HEAD）"
        required: false
        default: ""
      note:
        description: "本次发布说明（可选）"
        required: false
        default: ""

permissions:
  contents: read

env:
  IMAGE_TAG: souwen-release:local

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolve SOUWEN_REF (default HEAD of default branch)
        run: |
          REF="${{ github.event.inputs.souwen_ref }}"
          printf '%s' "$REF" | grep -Eq '^[0-9a-fA-F]{40}$' || REF=""
          echo "SOUWEN_REF=${REF}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOUWEN_REF == '' && github.sha || env.SOUWEN_REF }}

      - name: Verify checked-out tree matches SOUWEN_REF
        run: |
          REF="${SOUWEN_REF:-$(git rev-parse HEAD)}"
          test "$(git rev-parse HEAD)" = "$REF" || {
            echo "checkout mismatch: HEAD=$(git rev-parse HEAD) expected=$REF"; exit 1; }
          echo "SOUWEN_REF=$REF" >> "$GITHUB_ENV"
          echo "releasing exactly $(git rev-parse --short HEAD)"

      - name: Build root image from the selected SHA
        run: |
          docker build \
            --build-arg SOUWEN_SOURCE_SHA="$SOUWEN_REF" \
            -t "$IMAGE_TAG" .

      - name: Smoke /healthz
        run: |
          docker run -d --name souwen-release -p 127.0.0.1:49365:49265 \
            -e PORT=49265 -e WARP_ENABLED=0 "$IMAGE_TAG"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:49365/healthz > /dev/null 2>&1; then
              echo "healthz OK"; docker rm -f souwen-release; exit 0
            fi
            sleep 2
          done
          docker logs souwen-release || true
          docker rm -f souwen-release || true
          exit 1

      - name: Save image
        run: docker save "$IMAGE_TAG" | gzip > /tmp/souwen-image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: release-image
          path: /tmp/souwen-image.tar.gz
          retention-days: 7

      # ---- HFS 同步（可选：缺 secret 时跳过并说明）----
      # Space 仓库本身不携带构建历史：同步 = 推送选定 SHA 的源码树 +
      # cloud/hfs/Dockerfile（其 ARG SOUWEN_REF 默认值被改写为选定 SHA，
      # HF 工厂构建时按该 ARG clone 源码——这是 ref 的原生消费路径），
      # 再触发一次工厂重启。不用重启冒充部署。
      # secrets 在 step if 中不可用（actionlint/GH 上下文限制），空值检查在
      # 步骤内部完成。
      - name: Sync selected SHA source to HFS Space
        env:
          HFS_TOKEN: ${{ secrets.HFS_TOKEN }}
          HFS_SPACE: ${{ vars.HFS_SPACE }}
        run: |
          if [ -z "$HFS_SPACE" ] || [ -z "$HFS_TOKEN" ]; then
            echo "HFS_SPACE/HFS_TOKEN not configured; skipping sync (build + artifact only)."
            exit 0
          fi
          set -euo pipefail
          git config --global user.name "souwen-release-bot"
          git config --global user.email "noreply@blueskyxn.github.com"
          rm -rf /tmp/hfs-space
          git clone "https://oauth2:${HFS_TOKEN}@huggingface.co/spaces/${HFS_SPACE}" /tmp/hfs-space
          cd /tmp/hfs-space
          # Space 仓库历史保留（README 元数据在根），同步选定 SHA 的树
          rsync -a --delete \
            --exclude='.git' --exclude='README.md' \
            --exclude='local/' --exclude='souwen.yaml' --exclude='.env' \
            "$GITHUB_WORKSPACE/" ./
          cat > README.md <<'EOF'
          ---
          title: SouWen 搜文
          emoji: 🔍
          colorFrom: blue
          colorTo: purple
          sdk: docker
          app_port: 49265
          pinned: false
          ---

          # SouWen 搜文 3.x — Agent 免费搜索与抓取

          Docker SDK：`Dockerfile`（来自 cloud/hfs/）按其 `ARG SOUWEN_REF`
          默认值克隆对应 commit 构建并运行 `souwen serve`（HTTP API + MCP
          `/mcp`）。详细文档见 https://github.com/BlueSkyXN/SouWen
          EOF
          # ref 注入：改写 Space 端 Dockerfile 的 ARG 默认值（HF 工厂构建
          # 消费该 ARG；未设置时 Dockerfile 自身校验拒绝全零值）。
          sed -i "s/^ARG SOUWEN_REF=.*/ARG SOUWEN_REF=${SOUWEN_REF}/" Dockerfile
          grep -q "^ARG SOUWEN_REF=${SOUWEN_REF}$" Dockerfile || {
            echo "failed to inject SOUWEN_REF into Space Dockerfile"; exit 1; }
          git add -A
          if git diff --cached --quiet; then
            echo "Space tree already at ${SOUWEN_REF}"
          else
            git commit -m "release: sync SouWen 3.x at ${SOUWEN_REF}"
            git push origin main
          fi

      - name: Restart HFS Space factory build
        env:
          HFS_TOKEN: ${{ secrets.HFS_TOKEN }}
          HFS_SPACE: ${{ vars.HFS_SPACE }}
        run: |
          if [ -z "$HFS_SPACE" ] || [ -z "$HFS_TOKEN" ]; then
            echo "HFS sync skipped; nothing to restart."
            exit 0
          fi
          curl -fsS -X POST \
            "https://huggingface.co/api/spaces/${HFS_SPACE}/restart" \
            -H "Authorization: Bearer ${HFS_TOKEN}"
