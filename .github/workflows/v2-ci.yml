name: V2 CI

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: "要验证的 40 位候选提交 SHA"
        required: true
        type: string
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: v2-ci-${{ inputs.candidate_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lane:
    name: v2 CI lane selection
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      full: ${{ steps.lane.outputs.full }}
    steps:
      - id: lane
        run: |
          # fast lane：PR/main push 只跑 bootstrap 与 Provider v2 conformance；
          # full lane：release 复用调用、手动 dispatch、v* tag push 跑完整矩阵。
          full=false
          if [ "${{ github.event_name }}" = "workflow_call" ] || \
             [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ github.ref_type }}" = "tag" ]; then
            full=true
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"

  bootstrap:
    name: v2 bootstrap checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: panel/package-lock.json

      - name: Enforce target architecture dependencies
        run: python scripts/ci/check_architecture_dependencies.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests scripts tools

      - name: Ruff format check
        run: ruff format --check src tests scripts tools

      - name: Source catalog legacy term gate
        run: python scripts/ci/check_no_legacy_terms.py

      - name: Registry and docs tests
        run: |
          pytest tests/registry/test_consistency.py tests/test_gen_docs.py -q
          python tools/gen_docs.py --check
          python tools/check_markdown_links.py

      - name: Import and wheel surface tests
        run: |
          pytest tests/test_import_surface.py -q
          ( cd panel && npm ci && npm run build:local )
          wheelhouse="$(mktemp -d)"
          python -m pip wheel . --no-deps --wheel-dir "$wheelhouse"
          WHEELHOUSE="$wheelhouse" python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          wheel = next(Path(os.environ["WHEELHOUSE"]).glob("souwen-*.whl"))
          with zipfile.ZipFile(wheel) as zf:
              names = set(zf.namelist())

          removed_prefixes = (
              "souwen/facade/",
              "souwen/fetch/",
              "souwen/scraper/",
              "souwen/archive/",
              "souwen/cn_tech/",
              "souwen/developer/",
              "souwen/knowledge/",
              "souwen/office/",
              "souwen/social/",
              "souwen/video/",
              "souwen/web/api/",
              "souwen/web/engines/",
              "souwen/web/self_hosted/",
          )
          removed_files = {
              "souwen/_parsing.py",
              "souwen/exceptions.py",
              "souwen/fingerprint.py",
              "souwen/http_client.py",
              "souwen/rate_limiter.py",
              "souwen/retry.py",
              "souwen/session_cache.py",
              "souwen/source_registry.py",
          }
          unexpected = sorted(
              name
              for name in names
              if name in removed_files or any(name.startswith(prefix) for prefix in removed_prefixes)
          )
          if unexpected:
              raise SystemExit("removed v1 import surface leaked into wheel: " + ", ".join(unexpected))

          required = {
              "souwen/search.py",
              "souwen/registry/meta.py",
              "souwen/registry/sources/__init__.py",
              "souwen/web/fetch.py",
              "souwen/web/wayback.py",
              "souwen/server/panel.html",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit("required v2 import surface missing from wheel: " + ", ".join(missing))

          print(f"{wheel.name} import surface OK")
          PY

      - name: Registry baseline
        run: |
          python - <<'PY'
          from collections import Counter

          from souwen.registry import all_adapters, fetch_providers

          adapters_by_name = all_adapters()
          adapters = list(adapters_by_name.values())
          print("runtime_adapters", len(adapters))
          print("fetch_providers", len(fetch_providers()))
          for domain, count in sorted(Counter(adapter.domain for adapter in adapters).items()):
              print(f"{domain} {count}")
          PY

  matrix_tests:
    name: v2 pytest matrix (Python ${{ matrix.python }}, ${{ matrix.os }})
    needs: [lane, bootstrap]
    if: needs.lane.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.11" }
          - { os: windows-latest, python: "3.11" }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,tls,web,robots,scraper]"

      - name: Run tests
        if: '!(matrix.os == ''ubuntu-latest'' && matrix.python == ''3.12'')'
        run: pytest tests/ -v --tb=short

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: pytest tests/ --cov=souwen --cov-report=xml --cov-report=term --cov-fail-under=67

      - name: Upload coverage artifact
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: v2-coverage-report
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7

  provider_v2_conformance:
    name: v2 Provider v2 conformance
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deterministic test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,tls,web,robots,scraper]"

      - name: Run Provider v2 conformance
        run: |
          python tools/provider_migration_inventory.py --check --require-complete
          python tools/gen_provider_spec_drafts.py --check
          pytest \
            tests/provider_v2 \
            tests/test_provider_spi.py \
            tests/test_provider_spec_v2.py \
            tests/test_provider_migration_inventory.py \
            tests/test_provider_spec_drafts.py \
            tests/test_manifest_registry_v2.py \
            tests/test_provider_manager_v2.py \
            tests/test_openalex_provider_v2.py \
            tests/test_openalex_search_vertical_v2.py \
            tests/test_builtin_fetch_provider_v2.py \
            tests/test_uniapi_ark_provider_v2.py \
            tests/test_paper/test_eric.py \
            tests/test_eric_provider_v2.py \
            tests/test_patent/test_patentsview.py \
            tests/test_patentsview_provider_v2.py \
            -q

  delivery_contracts:
    name: v2 SDK and Server contracts
    needs: [lane, bootstrap]
    if: needs.lane.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,tls,web,robots,scraper]"

      - name: Run SDK and Server contracts
        run: |
          mkdir -p artifacts
          python scripts/ci/run_profile.py \
            --profile sdk-contract \
            --profile server-contract \
            --json-report artifacts/v2-delivery-contracts.json \
            --markdown-report artifacts/v2-delivery-contracts.md

      - name: Upload SDK and Server contract report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2-delivery-contracts-report
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  provider_runtime:
    name: v2 provider runtime profile
    needs: [lane, bootstrap]
    if: needs.lane.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,tls,web,robots,scraper,newspaper,readability]"

      - name: Run provider runtime profile
        run: |
          mkdir -p artifacts
          python scripts/ci/run_profile.py \
            --profile provider-runtime \
            --json-report artifacts/v2-provider-runtime.json \
            --markdown-report artifacts/v2-provider-runtime.md

      - name: Upload provider runtime report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2-provider-runtime-report
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  panel_build:
    name: v2 panel build
    needs: [lane, bootstrap]
    if: needs.lane.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: panel/package-lock.json

      - name: Install panel dependencies
        working-directory: panel
        run: npm ci

      - name: Panel unit tests
        working-directory: panel
        run: npm test

      - name: Build panel artifact
        working-directory: panel
        run: |
          npm run build:local
          npm run check:artifact
          test -f ../src/souwen/server/panel.html

      - name: Upload panel artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2-panel-html
          path: src/souwen/server/panel.html
          if-no-files-found: warn
          retention-days: 7

  release_readiness_summary:
    name: V2 CI / v2 release readiness summary
    needs:
      - lane
      - bootstrap
      - matrix_tests
      - provider_v2_conformance
      - delivery_contracts
      - provider_runtime
      - panel_build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize readiness gates
        env:
          FULL_LANE: ${{ needs.lane.outputs.full }}
          BOOTSTRAP_RESULT: ${{ needs.bootstrap.result }}
          MATRIX_RESULT: ${{ needs.matrix_tests.result }}
          PROVIDER_V2_RESULT: ${{ needs.provider_v2_conformance.result }}
          DELIVERY_RESULT: ${{ needs.delivery_contracts.result }}
          PROVIDER_RUNTIME_RESULT: ${{ needs.provider_runtime.result }}
          PANEL_RESULT: ${{ needs.panel_build.result }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## V2 release readiness

          Lane: $FULL_LANE (true = release/dispatch/tag full matrix, false = PR/main fast)

          | Gate | Result | Scope |
          |---|---|---|
          | Bootstrap / import / wheel surface | $BOOTSTRAP_RESULT | v2 import surface, docs, registry baseline |
          | Full pytest matrix | $MATRIX_RESULT | Python 3.10-3.13 on Ubuntu, plus macOS/Windows 3.11 |
          | Provider v2 conformance | $PROVIDER_V2_RESULT | deterministic SPI, manifest, manager, OpenAlex, builtin Fetch, UniAPI, ERIC, and PatentsView contracts |
          | SDK and Server contracts | $DELIVERY_RESULT | target contract/DTO prerequisites plus local Server/API surface |
          | Provider runtime profile | $PROVIDER_RUNTIME_RESULT | provider imports, doctor, fetch handlers, and browser variant declarations |
          | Panel build | $PANEL_RESULT | TypeScript, Vitest, single-file panel artifact |

          External smoke, HF Space deploy, and binary build remain outside
          automatic V2 CI. Run them manually or through tag/release workflows
          before cutting a release candidate tag.
          EOF

          if [ "$FULL_LANE" = "true" ]; then
            for result in "$BOOTSTRAP_RESULT" "$MATRIX_RESULT" "$PROVIDER_V2_RESULT" "$DELIVERY_RESULT" "$PROVIDER_RUNTIME_RESULT" "$PANEL_RESULT"; do
              if [ "$result" != "success" ]; then
                echo "V2 release readiness gate failed (full lane): $result" >&2
                exit 1
              fi
            done
          else
            for result in "$BOOTSTRAP_RESULT" "$PROVIDER_V2_RESULT"; do
              if [ "$result" != "success" ]; then
                echo "V2 fast lane gate failed: $result" >&2
                exit 1
              fi
            done
            for result in "$MATRIX_RESULT" "$DELIVERY_RESULT" "$PROVIDER_RUNTIME_RESULT" "$PANEL_RESULT"; do
              if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
                echo "V2 fast lane unexpected full-gate result: $result" >&2
                exit 1
              fi
            done
          fi
