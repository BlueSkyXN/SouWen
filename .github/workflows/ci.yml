name: CI

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: '要验证的 40 位候选提交 SHA'
        required: true
        type: string
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ inputs.candidate_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lane:
    name: CI lane selection
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      full: ${{ steps.lane.outputs.full }}
      test_matrix: ${{ steps.lane.outputs.test_matrix }}
    steps:
      - id: lane
        run: |
          # fast lane：PR/main push 只跑 Python 3.13 + ubuntu-24.04 单组合；
          # full lane：release 复用调用、手动 dispatch、v* tag push 跑完整矩阵。
          full=false
          if [ "${{ github.event_name }}" = "workflow_call" ] || \
             [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ github.ref_type }}" = "tag" ]; then
            full=true
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          if [ "$full" = "true" ]; then
            matrix='{"include":[{"os":"ubuntu-latest","python":"3.10"},{"os":"ubuntu-latest","python":"3.11"},{"os":"ubuntu-latest","python":"3.12"},{"os":"ubuntu-latest","python":"3.13"},{"os":"macos-latest","python":"3.11"},{"os":"windows-latest","python":"3.11"}]}'
          else
            matrix='{"include":[{"os":"ubuntu-24.04","python":"3.13"}]}'
          fi
          echo "test_matrix=$matrix" >> "$GITHUB_OUTPUT"

  architecture:
    name: Architecture dependency gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Enforce target architecture dependencies
        run: python scripts/ci/check_architecture_dependencies.py

  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装 ruff
        run: pip install "ruff==0.15.22"

      - name: Ruff 语法检查
        run: ruff check src tests scripts tools

      - name: Ruff 格式检查
        run: ruff format --check src tests scripts tools

  docs-check:
    name: Generated docs and Markdown links
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install docs validation dependencies
        run: pip install -e ".[dev]"

      - name: Validate generated docs, links, and legacy terminology
        run: |
          mkdir -p artifacts
          python tools/gen_docs.py --check
          python tools/check_markdown_links.py \
            --json-report artifacts/markdown-links.json
          python scripts/ci/check_no_legacy_terms.py

      - name: Upload docs validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-docs-report
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  test:
    name: 测试 (Python ${{ matrix.python }}, ${{ matrix.os }})
    needs: [lane, lint]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.lane.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,tls,web,robots,scraper]"

      - name: 运行测试
        if: '!(matrix.os == ''ubuntu-latest'' && matrix.python == ''3.12'')'
        run: pytest tests/ -v --tb=short

      - name: 运行测试（含覆盖率）
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: pytest tests/ --cov=souwen --cov-report=xml --cov-report=term --cov-fail-under=67

      - name: 上传覆盖率到 Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: 安装 Provider runtime profile 依赖
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: pip install -e ".[dev,server,tls,web,robots,scraper,newspaper,readability]"

      - name: 运行 Provider runtime profile
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          mkdir -p artifacts
          python scripts/ci/run_profile.py \
            --profile provider-runtime \
            --json-report artifacts/provider-runtime.json \
            --markdown-report artifacts/provider-runtime.md

      - name: 上传 Provider runtime profile 报告
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: provider-runtime-report
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  server-test:
    name: 服务端测试
    needs: [lane, lint]
    if: needs.lane.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装 Server 测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,tls,web,robots,scraper]"

      - name: 运行服务端测试
        run: pytest tests/test_server -v --tb=short

  panel-build:
    name: Panel 构建检查
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: panel/package-lock.json

      - name: 安装 panel 依赖
        working-directory: panel
        run: npm ci

      - name: 前端单元测试
        working-directory: panel
        run: npm test

      - name: 构建 panel 并验证产物
        working-directory: panel
        run: |
          npm run build:local
          npm run check:artifact

      - name: 显示 panel.html 信息
        run: |
          echo "✅ panel.html 大小: $(wc -c < src/souwen/server/panel.html) 字节"

  package-build:
    name: Build wheel and sdist
    needs: [lane, lint]
    if: needs.lane.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Build embedded panel
        working-directory: panel
        run: |
          npm ci
          npm run build:local
          npm run check:artifact

      - name: Build Python distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
          test "$(find dist -maxdepth 1 -name 'souwen-*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name 'souwen-*.tar.gz' | wc -l)" -eq 1

      - name: Upload Python distributions
        uses: actions/upload-artifact@v7
        with:
          name: ci-python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  clean-wheel:
    name: Clean wheel (${{ matrix.profile }})
    needs: [lane, package-build]
    if: needs.lane.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: sdk-default, install: "" }
          - { profile: server-runtime, install: "server,tls,web,robots,scraper" }
          - { profile: provider-newspaper, install: "server,tls,web,robots,scraper,newspaper" }
          - { profile: provider-readability, install: "server,tls,web,robots,scraper,readability" }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: ci-python-distributions
          path: dist

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install wheel into an isolated environment
        run: |
          wheel="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name 'souwen-*.whl' -print -quit)"
          test -n "$wheel"
          python -m venv "$RUNNER_TEMP/clean-wheel"
          "$RUNNER_TEMP/clean-wheel/bin/python" -m pip install --upgrade pip
          if [ -n "${{ matrix.install }}" ]; then
            "$RUNNER_TEMP/clean-wheel/bin/python" -m pip install "${wheel}[${{ matrix.install }}]"
          else
            "$RUNNER_TEMP/clean-wheel/bin/python" -m pip install "$wheel"
          fi
          "$RUNNER_TEMP/clean-wheel/bin/python" -m pip check

      - name: Probe isolated package contract
        uses: ./.github/actions/clean-wheel-smoke
        env:
          HOME: ${{ runner.temp }}/clean-home
        with:
          python: ${{ runner.temp }}/clean-wheel/bin/python
          profile: ${{ matrix.profile }}
          candidate-sha: ${{ inputs.candidate_sha || github.sha }}
          report-json: artifacts/clean-wheel-${{ matrix.profile }}.json
          freeze-report: artifacts/clean-wheel-${{ matrix.profile }}-freeze.txt

      - name: Upload clean-wheel evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-clean-wheel-${{ matrix.profile }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  performance:
    name: Deterministic cold-start performance
    needs: [lane, lint]
    if: needs.lane.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install basic runtime
        run: pip install -e ".[dev,server,tls,web,robots,scraper]"

      - name: Measure seven cold processes and enforce medians
        env:
          PYTHONPATH: src
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          import json
          import os
          import statistics
          import subprocess
          import sys
          import time
          from pathlib import Path

          checks = {
              "package_import": ([sys.executable, "-c", "import souwen"], 1.50),
              "provider_catalog": (
                  [
                      sys.executable,
                      "-c",
                      "from souwen.providers.catalog import builtin_provider_manifests; builtin_provider_manifests()",
                  ],
                  1.50,
              ),
              "server_import": (
                  [sys.executable, "-c", "from souwen.server.app import app"],
                  2.50,
              ),
          }
          report = {
              "samples": 7,
              "python": sys.version,
              "platform": sys.platform,
              "checks": {},
          }
          env = os.environ.copy()
          for name, (command, threshold) in checks.items():
              samples = []
              for _ in range(7):
                  started = time.perf_counter()
                  subprocess.run(
                      command,
                      check=True,
                      env=env,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  samples.append(time.perf_counter() - started)
              median = statistics.median(samples)
              report["checks"][name] = {
                  "median_seconds": round(median, 6),
                  "threshold_seconds": threshold,
                  "samples_seconds": [round(value, 6) for value in samples],
              }
              if median > threshold:
                  raise SystemExit(
                      f"{name} median {median:.3f}s exceeds {threshold:.3f}s threshold"
                  )
          Path("artifacts/performance.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2))
          PY

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-performance-report
          path: artifacts/performance.json
          if-no-files-found: warn
          retention-days: 14

  targeted-coverage:
    name: Runtime capability doctor coverage (90%)
    needs: [lane, lint]
    if: needs.lane.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        run: pip install -e ".[dev,server,tls,web,robots,scraper]"

      - name: Enforce targeted module coverage
        run: |
          pytest \
            tests/test_gen_docs.py \
            tests/test_manifest_registry_v2.py \
            tests/test_provider_manager_v2.py \
            --cov=souwen.providers.catalog \
            --cov-report=term \
            --cov-report=xml:targeted-coverage.xml \
            --cov-report=json:targeted-coverage.json \
            --cov-fail-under=90

      - name: Upload targeted coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-targeted-coverage
          path: |
            targeted-coverage.xml
            targeted-coverage.json
          if-no-files-found: warn
          retention-days: 14

  dependency-audit:
    name: Dependency audit
    needs: [lane, lint]
    if: needs.lane.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Python dependency audit
        run: |
          mkdir -p artifacts
          python -m pip install --upgrade pip "setuptools>=83" pip-audit
          pip install -e ".[server,tls,web,robots,scraper,newspaper,readability]"
          pip-audit --local --progress-spinner=off \
            --format=json --output=artifacts/pip-audit.json

      - name: Panel dependency audit
        working-directory: panel
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high --json > ../artifacts/npm-audit.json

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-dependency-audit-report
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  container-surface:
    name: Container build and smoke (${{ matrix.kind }})
    needs: [lane, lint]
    if: needs.lane.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: root, dockerfile: Dockerfile, context: '.', port: 49265 }
          - { kind: hfs, dockerfile: cloud/hfs/Dockerfile, context: cloud/hfs, port: 49265 }
          - { kind: modelscope, dockerfile: cloud/modelscope/Dockerfile, context: cloud/modelscope, port: 7860 }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Materialize exact candidate as a local Git endpoint
        if: matrix.kind != 'root'
        run: |
          bare="$RUNNER_TEMP/souwen.git"
          git init --bare "$bare"
          git push "$bare" HEAD:refs/heads/ci-candidate
          git --git-dir="$bare" update-server-info
          nohup git daemon --reuseaddr --export-all \
            --base-path="$RUNNER_TEMP" --listen=0.0.0.0 --port=9418 \
            >"$RUNNER_TEMP/git-daemon.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/git-daemon.pid"
          for _ in $(seq 1 20); do
            git ls-remote git://127.0.0.1:9418/souwen.git ci-candidate >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Build root image
        if: matrix.kind == 'root'
        run: |
          docker build \
            -f "${{ matrix.dockerfile }}" \
            --build-arg SOUWEN_SOURCE_SHA="$SOURCE_SHA" \
            -t "souwen-ci:${{ matrix.kind }}" \
            "${{ matrix.context }}"

      - name: Build cloud wrapper image from exact candidate
        if: matrix.kind != 'root'
        run: |
          docker build --network host \
            -f "${{ matrix.dockerfile }}" \
            --build-arg SOUWEN_REPO=git://127.0.0.1:9418/souwen.git \
            --build-arg SOUWEN_REF="$SOURCE_SHA" \
            -t "souwen-ci:${{ matrix.kind }}" \
            "${{ matrix.context }}"

      - name: Start container and verify health
        run: |
          docker run -d --name "souwen-ci-${{ matrix.kind }}" \
            -p "127.0.0.1:${{ matrix.port }}:${{ matrix.port }}" \
            -e SOUWEN_EXPOSE_DOCS=1 \
            -e WARP_ENABLED=0 \
            "souwen-ci:${{ matrix.kind }}"
          for _ in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:${{ matrix.port }}/healthz" >/dev/null; then
              curl -fsS "http://127.0.0.1:${{ matrix.port }}/readyz" | \
                jq -e --arg source_sha "$SOURCE_SHA" \
                  '.ready == true and .source_sha == $source_sha' >/dev/null
              panel_file="$RUNNER_TEMP/souwen-panel-${{ matrix.kind }}.html"
              curl -fsS "http://127.0.0.1:${{ matrix.port }}/panel" -o "$panel_file"
              grep -Eiq 'id="root"|SouWen|souwen' "$panel_file"
              curl -fsS "http://127.0.0.1:${{ matrix.port }}/openapi.json" | jq -e '.info.title == "SouWen API"' >/dev/null
              status="$(curl -sS -o /dev/null -w '%{http_code}' \
                "http://127.0.0.1:${{ matrix.port }}/api/v1/admin/ping")"
              test "$status" = 401
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs "souwen-ci-${{ matrix.kind }}" || true

      - name: Cleanup container and local Git endpoint
        if: always()
        run: |
          docker rm -f "souwen-ci-${{ matrix.kind }}" || true
          if [ -f "$RUNNER_TEMP/git-daemon.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/git-daemon.pid")" || true
          fi

  aggregate:
    name: CI / aggregate
    needs:
      - lane
      - architecture
      - lint
      - docs-check
      - test
      - server-test
      - panel-build
      - package-build
      - clean-wheel
      - performance
      - targeted-coverage
      - dependency-audit
      - container-surface
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI gate
        env:
          FULL_LANE: ${{ needs.lane.outputs.full }}
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS_JSON" | tee "$GITHUB_STEP_SUMMARY"
          if [ "$FULL_LANE" = "true" ]; then
            jq -e 'del(.lane) | all(.[]; .result == "success")' <<<"$NEEDS_JSON" >/dev/null
          else
            jq -e '
              ([.["architecture","lint","docs-check","test","panel-build"] | .result] | all(. == "success"))
              and
              ([del(.lane,.architecture,.lint,.["docs-check"],.test,.["panel-build"]) | .[] | .result]
               | all(. == "success" or . == "skipped"))
            ' <<<"$NEEDS_JSON" >/dev/null
          fi
