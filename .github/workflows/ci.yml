# 基础 CI：ruff、pytest、根镜像可构建。体检走 census.yml，镜像发布走 image.yml（P4）。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install "ruff==0.16.4"
      - name: Ruff check
        run: ruff check src tests scripts tools
      - name: Ruff format check
        run: ruff format --check src tests scripts tools

  test:
    name: Pytest (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,tls,web,robots,scraper]"
      - name: Run tests
        run: python -m pytest tests/ -q --tb=short

  image:
    name: Root image builds
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build root Dockerfile
        run: |
          docker build \
            --build-arg SOUWEN_SOURCE_SHA="$(git rev-parse HEAD)" \
            -t souwen-ci:local .
      - name: Smoke container /healthz
        run: |
          docker run -d --name souwen-ci -p 127.0.0.1:49365:49265 \
            -e PORT=49265 -e WARP_ENABLED=0 souwen-ci:local
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:49365/healthz > /dev/null 2>&1; then
              echo "healthz OK"; docker rm -f souwen-ci; exit 0
            fi
            sleep 2
          done
          docker logs souwen-ci || true
          docker rm -f souwen-ci || true
          exit 1
