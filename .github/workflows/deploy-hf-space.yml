name: HF Space CD

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: "要部署的 40 位候选提交 SHA"
        required: true
        type: string
      version:
        description: "必须与候选 pyproject.toml 一致的 PEP 440 版本"
        required: true
        type: string
      verifier_sha:
        description: "来自受信 main control plane 的 40 位 smoke harness SHA"
        required: true
        type: string
      deploy_hfs:
        description: "显式执行 HFS promotion 与验收"
        required: true
        type: boolean
      recovery_from_run_id:
        description: "显式 paused forward-recovery 所依据的失败 Release run ID"
        required: false
        default: ""
        type: string
      expected_paused_space_sha:
        description: "Recovery 前必须保持的 paused Space wrapper SHA"
        required: false
        default: ""
        type: string
      expected_paused_source_sha:
        description: "Recovery 前 paused wrapper 必须唯一 pin 的 source SHA"
        required: false
        default: ""
        type: string
      expected_failed_candidate_sha:
        description: "Recovery 来源 run 的失败 candidate SHA"
        required: false
        default: ""
        type: string
      expected_prior_space_sha:
        description: "失败 transaction 的直接 parent wrapper SHA"
        required: false
        default: ""
        type: string
      expected_prior_source_sha:
        description: "Transaction parent wrapper 必须唯一 pin 的 SouWen source SHA"
        required: false
        default: ""
        type: string
    outputs:
      space_commit_sha:
        description: "Space repository commit verified by runtime.raw.sha"
        value: ${{ jobs.sync-hfs-wrapper.outputs.space_commit_sha }}
      version:
        description: "Promoted SouWen version"
        value: ${{ jobs.sync-hfs-wrapper.outputs.version }}
      promotion_changed:
        description: "Whether this run created a new Space wrapper commit"
        value: ${{ jobs.sync-hfs-wrapper.outputs.promotion_changed }}
      prior_space_commit_sha:
        description: "Immutable Space wrapper commit captured before promotion"
        value: ${{ jobs.sync-hfs-wrapper.outputs.prior_space_commit_sha }}
      prior_runtime_commit_sha:
        description: "Space runtime commit captured before promotion"
        value: ${{ jobs.sync-hfs-wrapper.outputs.prior_runtime_commit_sha }}
      prior_souwen_ref:
        description: "Immutable SouWen source pin captured before promotion"
        value: ${{ jobs.sync-hfs-wrapper.outputs.prior_souwen_ref }}
      prior_runtime_stage:
        description: "Stable Space runtime stage captured before promotion"
        value: ${{ jobs.sync-hfs-wrapper.outputs.prior_runtime_stage }}
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "deploy/**"
      - "tests/**"
      - "panel/**"
      - "pyproject.toml"
      - "README.md"
      - "README.en.md"
      - "docs/**"
      - "souwen.example.yaml"
      - "entrypoint.sh"
      - "scripts/ci/**"
      - "scripts/hf_space_llm_preflight.py"
      - "scripts/hf_space_recovery_contract.py"
      - "scripts/hf_space_smoke.py"
      - "scripts/fixtures/hf-space-fetch-probe.html"
      - "scripts/fixtures/hf-space-browser-probe.html"
      - "scripts/warp-init.sh"
      - "cloud/hfs/**"
      - ".github/workflows/deploy-hf-space.yml"
      - ".github/workflows/recover-hf-space.yml"
      - ".github/workflows/build-pyinstaller-server.yml"
  workflow_dispatch:

concurrency:
  # One mutable Space is promoted at a time; local preflights remain cancellable.
  group: hf-space-cd-${{ inputs.deploy_hfs && 'promotion' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.deploy_hfs }}

permissions:
  contents: read

jobs:
  detect-changes:
    name: Resolve deploy eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy_changed: ${{ steps.deploy-paths.outputs.deploy_changed }}
      reason: ${{ steps.deploy-paths.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate reusable candidate contract
        if: ${{ inputs.deploy_hfs }}
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
          VERIFIER_SHA: ${{ inputs.verifier_sha }}
          DEPLOY_HFS: ${{ inputs.deploy_hfs }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          import tomllib
          from urllib.request import Request, urlopen

          candidate = os.environ["CANDIDATE_SHA"]
          version = os.environ["EXPECTED_VERSION"]
          verifier = os.environ["VERIFIER_SHA"]
          owner = os.environ["REPOSITORY_OWNER"]
          if os.environ["RUN_ATTEMPT"] != "1":
              raise SystemExit("reusable HF Space CD reruns are not allowed")
          if any(
              actor.casefold() != owner.casefold()
              for actor in (
                  os.environ["DISPATCH_ACTOR"],
                  os.environ["TRIGGERING_ACTOR"],
              )
          ):
              raise SystemExit("HF promotion requires repository-owner dispatch")
          if re.fullmatch(r"[0-9a-f]{40}", candidate) is None:
              raise SystemExit("candidate_sha must be exactly 40 lowercase hexadecimal characters")
          if re.fullmatch(r"[0-9a-f]{40}", verifier) is None:
              raise SystemExit("verifier_sha must be exactly 40 lowercase hexadecimal characters")
          if os.environ["DEPLOY_HFS"] != "true":
              raise SystemExit("reusable HF Space CD requires deploy_hfs=true")
          if os.environ["WORKFLOW_REF"] != "refs/heads/main":
              raise SystemExit("HF promotion requires a control-plane workflow from main")
          request = Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/git/ref/heads/main",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urlopen(request, timeout=30) as response:
              main_ref = json.load(response)
          origin_main = str((main_ref.get("object") or {}).get("sha") or "")
          if re.fullmatch(r"[0-9a-f]{40}", origin_main) is None:
              raise SystemExit("cannot prove current GitHub main SHA")
          if candidate != origin_main:
              raise SystemExit("HF promotion candidate must equal current GitHub main")
          if verifier != os.environ["WORKFLOW_SHA"] or verifier != origin_main:
              raise SystemExit("verifier_sha and workflow SHA must equal current GitHub main")
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if head != candidate:
              raise SystemExit(f"checkout mismatch: expected {candidate}, got {head}")
          with open("pyproject.toml", "rb") as file:
              actual_version = tomllib.load(file)["project"]["version"]
          if actual_version != version:
              raise SystemExit(
                  f"version mismatch: input={version!r}, pyproject={actual_version!r}"
              )
          print(f"validated immutable HFS candidate {candidate} version {version}")
          PY

      - name: Detect deploy-related path changes
        id: deploy-paths
        env:
          REQUESTED_DEPLOY_HFS: ${{ inputs.deploy_hfs }}
        run: |
          python - <<'PY'
          import os

          event = os.environ["GITHUB_EVENT_NAME"]
          ref = os.environ["GITHUB_REF"]
          output_path = os.environ["GITHUB_OUTPUT"]

          def write_output(deploy_changed: bool, reason: str) -> None:
              with open(output_path, "a", encoding="utf-8") as output:
                  output.write(f"deploy_changed={'true' if deploy_changed else 'false'}\n")
                  output.write(f"reason={reason}\n")
              print(f"deploy_changed={deploy_changed}, reason={reason}")

          if os.environ.get("REQUESTED_DEPLOY_HFS") == "true":
              write_output(True, "release-candidate")
              raise SystemExit
          write_output(False, f"{event}:{ref}:local-preflight-only")
          PY

  delivery-contracts:
    name: SDK and Server contracts
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install source package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,tls,web,robots,scraper]"

      - name: Run SDK and Server contracts
        env:
          PYTHONIOENCODING: utf-8
        run: |
          mkdir -p artifacts
          python scripts/ci/run_profile.py \
            --profile sdk-contract \
            --profile server-contract \
            --json-report artifacts/hfs-delivery-contracts.json \
            --markdown-report artifacts/hfs-delivery-contracts.md

      - name: Upload SDK and Server contract report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hfs-delivery-contracts-report
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  docker-hfs:
    name: HF Space Docker surface smoke
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.clone_url }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DEFAULT_REPO: https://github.com/${{ github.repository }}.git
      DEFAULT_REF: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Resolve source ref for HFS Dockerfile clone
        id: source
        run: |
          SOURCE_REPO="${PR_HEAD_REPO:-$DEFAULT_REPO}"
          SOURCE_REF="${PR_HEAD_SHA:-$DEFAULT_REF}"
          if [ -z "$SOURCE_REPO" ] || [ -z "$SOURCE_REF" ]; then
            echo "::error::Cannot resolve source repo/ref for Docker build"
            exit 1
          fi
          {
            echo "repo=$SOURCE_REPO"
            echo "ref=$SOURCE_REF"
          } >> "$GITHUB_OUTPUT"
          echo "HFS Docker source: $SOURCE_REPO @ $SOURCE_REF"

      - name: Build HF Space Docker image from current ref
        run: |
          docker build \
            -f cloud/hfs/Dockerfile \
            --build-arg SOUWEN_REPO="${{ steps.source.outputs.repo }}" \
            --build-arg SOUWEN_REF="${{ steps.source.outputs.ref }}" \
            -t "souwen-hfs-local:${GITHUB_SHA::7}" \
            cloud/hfs

      - name: Run container and wait for readiness
        run: |
          docker run -d --name souwen-hfs-local \
            -p 49265:49265 \
            -e SOUWEN_ADMIN_OPEN=1 \
            -e SOUWEN_USER_PASSWORD= \
            -e SOUWEN_EXPOSE_DOCS=1 \
            -e SOUWEN_WRAPPER_SHA=${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }} \
            -e SOUWEN_CONFIG_REVISION=source-${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }} \
            -e WARP_ENABLED=0 \
            "souwen-hfs-local:${GITHUB_SHA::7}"

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:49265/readyz; then
              exit 0
            fi
            echo "Waiting for target readiness (${attempt}/60)"
            sleep 2
          done

          docker logs souwen-hfs-local
          exit 1

      - name: Run local API surface smoke
        env:
          SOUWEN_SMOKE_REPORT_FILE: hf-space-local-surface-report.md
          SOUWEN_SMOKE_JSON_FILE: hf-space-local-surface-report.json
          EXPECTED_SOUWEN_SOURCE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          VERSION="$(python3 - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as file:
              print(tomllib.load(file)["project"]["version"])
          PY
          )"
          python3 scripts/hf_space_smoke.py \
            --base-url http://127.0.0.1:49265 \
            --expected-version "$VERSION" \
            --expected-wrapper-sha "$EXPECTED_SOUWEN_SOURCE_SHA" \
            --require-target-runtime \
            --request-timeout 10 \
            --surface-only

      - name: Verify Browser Worker remains internal
        run: |
          test -z "$(docker port souwen-hfs-local 49266/tcp 2>/dev/null || true)"

      - name: Verify browser entry HTML explicitly
        run: |
          curl -fsSL http://127.0.0.1:49265/docs -o /tmp/souwen-docs.html
          grep -Eiq 'Swagger UI|swagger-ui' /tmp/souwen-docs.html
          curl -fsSL http://127.0.0.1:49265/panel -o /tmp/souwen-panel.html
          grep -Eiq 'id="root"|SouWen|souwen' /tmp/souwen-panel.html

      - name: Show container logs
        if: always()
        run: docker logs souwen-hfs-local || true

      - name: Stop container
        if: always()
        run: docker rm -f souwen-hfs-local || true

      - name: Upload local smoke reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hf-space-local-surface-report
          path: |
            hf-space-local-surface-report.md
            hf-space-local-surface-report.json
          if-no-files-found: warn
          retention-days: 7

  sync-hfs-wrapper:
    name: Sync HFS wrapper files
    if: >-
      ${{
        needs.detect-changes.outputs.deploy_changed == 'true' &&
        inputs.deploy_hfs
      }}
    needs: [detect-changes, delivery-contracts, docker-hfs]
    environment:
      name: hf
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.project.outputs.version }}
      space_commit_sha: ${{ steps.sync.outputs.space_commit_sha }}
      promotion_changed: ${{ steps.sync.outputs.promotion_changed }}
      settings_mutation_started: ${{ steps.settings_mutation.outputs.settings_mutation_started }}
      prior_space_commit_sha: ${{ steps.prior.outputs.prior_space_commit_sha }}
      prior_runtime_commit_sha: ${{ steps.prior.outputs.prior_runtime_commit_sha }}
      prior_souwen_ref: ${{ steps.prior.outputs.prior_souwen_ref }}
      prior_runtime_stage: ${{ steps.prior.outputs.prior_runtime_stage }}
      sync_parent_sha: ${{ steps.prior.outputs.sync_parent_sha }}
    steps:
      - name: Require HFS deployment secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_READ_TOKEN: ${{ secrets.HF_SPACE_READ_TOKEN }}
          SOUWEN_SMOKE_BEARER_TOKEN: ${{ secrets.SOUWEN_SMOKE_BEARER_TOKEN }}
          SOUWEN_CONFIG_B64: ${{ secrets.SOUWEN_CONFIG_B64 }}
          UNIAPI_API_KEY: ${{ secrets.UNIAPI_API_KEY }}
        run: |
          missing=()
          for name in HF_TOKEN HF_SPACE_READ_TOKEN SOUWEN_SMOKE_BEARER_TOKEN SOUWEN_CONFIG_B64 UNIAPI_API_KEY; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            for name in "${missing[@]}"; do
              echo "::error::Required HFS environment secret is not configured: $name"
            done
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install HFS deployment clients
        run: |
          python -m pip install "huggingface_hub>=1.8,<2" "PyYAML>=6,<7"
          python -m pip install -e ".[server,tls,web,robots,scraper]"

      - name: Validate required HFS LLM Search configuration
        env:
          SOUWEN_CONFIG_B64: ${{ secrets.SOUWEN_CONFIG_B64 }}
        run: |
          python -I - <<'PY'
          import base64
          import os
          import re
          from urllib.parse import urlsplit

          import yaml

          try:
              decoded = base64.b64decode(
                  os.environ["SOUWEN_CONFIG_B64"],
                  validate=True,
              ).decode("utf-8")
              config = yaml.safe_load(decoded)
          except Exception as exc:
              raise SystemExit("SOUWEN_CONFIG_B64 is not valid base64-encoded YAML") from exc
          if not isinstance(config, dict):
              raise SystemExit("SOUWEN_CONFIG_B64 YAML root must be a mapping")

          gateways = config.get("llm_search_gateways")
          uniapi = gateways.get("uniapi") if isinstance(gateways, dict) else None
          if not isinstance(uniapi, dict):
              raise SystemExit("HFS promotion requires llm_search_gateways.uniapi")
          api_key = uniapi.get("api_key")
          base_url = uniapi.get("base_url")
          env_reference = re.compile(r"^\$\{([A-Z_][A-Z0-9_]*)\}$")
          if not isinstance(api_key, str) or not api_key.strip():
              raise SystemExit("HFS promotion requires a UniAPI API key or exact env reference")
          if not isinstance(base_url, str) or not base_url.strip():
              raise SystemExit("HFS promotion requires a literal UniAPI base URL")
          api_key_reference = env_reference.fullmatch(api_key.strip())
          if api_key_reference is not None and api_key_reference.group(1) != "UNIAPI_API_KEY":
              raise SystemExit("HFS UniAPI API key uses an unmanaged environment reference")
          if env_reference.fullmatch(base_url.strip()) is not None:
              raise SystemExit("HFS UniAPI base URL must not use an environment reference")
          parsed = urlsplit(base_url.strip())
          if parsed.scheme not in {"http", "https"} or not parsed.hostname:
              raise SystemExit("HFS UniAPI base URL must be a literal HTTP(S) URL")

          sources = config.get("sources")
          source_ids = (
              "uniapi_ark_annotations_deepseek_v3_2_251201",
              "uniapi_ark_annotations_doubao_seed_2_0_lite_260428",
          )
          enabled = [
              source_id
              for source_id in source_ids
              if isinstance(sources, dict)
              and isinstance(sources.get(source_id), dict)
              and sources[source_id].get("enabled") is True
          ]
          if len(enabled) != 1:
              raise SystemExit("HFS promotion requires exactly one enabled LLM Search Provider")
          print("HFS LLM Search configuration preflight passed")
          PY

      - name: Read expected SouWen version
        id: project
        run: |
          python -I - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("pyproject.toml", "rb") as file:
              project = tomllib.load(file)["project"]
          print(f"version={project['version']}")
          PY

      - name: Capture immutable rollback point
        id: prior
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: BlueSkyXN/SouWen
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          RECOVERY_FROM_RUN_ID: ${{ inputs.recovery_from_run_id }}
          EXPECTED_PAUSED_SPACE_SHA: ${{ inputs.expected_paused_space_sha }}
          EXPECTED_PAUSED_SOURCE_SHA: ${{ inputs.expected_paused_source_sha }}
          EXPECTED_FAILED_CANDIDATE_SHA: ${{ inputs.expected_failed_candidate_sha }}
          EXPECTED_PRIOR_SPACE_SHA: ${{ inputs.expected_prior_space_sha }}
          EXPECTED_PRIOR_SOURCE_SHA: ${{ inputs.expected_prior_source_sha }}
        run: |
          python -I - <<'PY'
          import os
          import re
          import sys
          import time
          from pathlib import Path

          from huggingface_hub import HfApi, hf_hub_download

          sys.path.insert(0, os.getcwd())
          from scripts.hf_space_recovery_contract import (  # noqa: E402
              RecoveryContractError,
              validate_recovery_topology,
          )

          api = HfApi(token=os.environ["HF_TOKEN"])
          space_id = os.environ["HF_SPACE_ID"]
          candidate_sha = os.environ["CANDIDATE_SHA"]
          recovery_fields = {
              "recovery_from_run_id": os.environ.get("RECOVERY_FROM_RUN_ID", ""),
              "expected_paused_space_sha": os.environ.get("EXPECTED_PAUSED_SPACE_SHA", ""),
              "expected_paused_source_sha": os.environ.get(
                  "EXPECTED_PAUSED_SOURCE_SHA", ""
              ),
              "expected_failed_candidate_sha": os.environ.get(
                  "EXPECTED_FAILED_CANDIDATE_SHA", ""
              ),
              "expected_prior_space_sha": os.environ.get("EXPECTED_PRIOR_SPACE_SHA", ""),
              "expected_prior_source_sha": os.environ.get("EXPECTED_PRIOR_SOURCE_SHA", ""),
          }
          populated_recovery_fields = {
              name for name, value in recovery_fields.items() if value
          }
          if populated_recovery_fields and len(populated_recovery_fields) != len(
              recovery_fields
          ):
              raise SystemExit("recovery inputs must be either all empty or all populated")
          recovery = bool(populated_recovery_fields)
          if recovery:
              if not recovery_fields["recovery_from_run_id"].isdigit():
                  raise SystemExit("recovery_from_run_id must be numeric")
              for name in (
                  "expected_paused_space_sha",
                  "expected_paused_source_sha",
                  "expected_failed_candidate_sha",
                  "expected_prior_space_sha",
                  "expected_prior_source_sha",
              ):
                  if re.fullmatch(r"[0-9a-f]{40}", recovery_fields[name]) is None:
                      raise SystemExit(f"{name} must be an immutable 40-character SHA")
          if re.fullmatch(r"[0-9a-f]{40}", candidate_sha) is None:
              raise SystemExit("candidate_sha must be an immutable 40-character SHA")

          target_info = api.repo_info(repo_id=space_id, repo_type="space")
          if target_info.private is not True:
              raise SystemExit(
                  f"refusing promotion: target Space {space_id} must already be private"
              )
          prior_space_sha = str(target_info.sha)
          if re.fullmatch(r"[0-9a-f]{40}", prior_space_sha) is None:
              raise SystemExit("target Space does not expose an immutable 40-character commit")

          def source_pin(revision: str) -> str:
              dockerfile = Path(
                  hf_hub_download(
                      repo_id=space_id,
                      repo_type="space",
                      filename="Dockerfile",
                      revision=revision,
                      token=os.environ["HF_TOKEN"],
                      force_download=True,
                  )
              ).read_text(encoding="utf-8")
              matches = re.findall(
                  r"^ARG SOUWEN_REF=([0-9a-f]{40})$", dockerfile, re.MULTILINE
              )
              if len(matches) != 1:
                  raise SystemExit(
                      "target Space Dockerfile must contain exactly one immutable SOUWEN_REF "
                      "before automatic promotion or operator-led recovery is allowed"
                  )
              return matches[0]

          if recovery:
              runtime = api.get_space_runtime(repo_id=space_id)
              stage = str(getattr(runtime.stage, "value", runtime.stage))
              if stage.upper() != "PAUSED":
                  raise SystemExit(
                      "paused recovery requires the target Space to remain PAUSED: "
                      f"stage={stage}"
                  )
              expected_paused_sha = recovery_fields["expected_paused_space_sha"]
              current_pin = source_pin(prior_space_sha)
              expected_prior_space = recovery_fields["expected_prior_space_sha"]
              prior_pin = source_pin(expected_prior_space)
              expected_prior_source = recovery_fields["expected_prior_source_sha"]
              if prior_pin != expected_prior_source:
                  raise SystemExit(
                      "paused recovery prior source pin mismatch: "
                      f"expected={expected_prior_source}, current={prior_pin}"
                  )

              direct_parent_sha = None
              if prior_space_sha != expected_prior_space:
                  commits = api.list_repo_commits(
                      repo_id=space_id,
                      repo_type="space",
                      revision=prior_space_sha,
                  )
                  if (
                      len(commits) < 2
                      or str(commits[0].commit_id) != prior_space_sha
                  ):
                      raise SystemExit(
                          "paused recovery could not prove the paused wrapper ancestry"
                      )
                  direct_parent_sha = str(commits[1].commit_id)
              try:
                  topology = validate_recovery_topology(
                      paused_space_sha=prior_space_sha,
                      paused_source_sha=current_pin,
                      expected_paused_space_sha=expected_paused_sha,
                      expected_paused_source_sha=recovery_fields[
                          "expected_paused_source_sha"
                      ],
                      failed_candidate_sha=recovery_fields[
                          "expected_failed_candidate_sha"
                      ],
                      prior_space_sha=expected_prior_space,
                      prior_source_sha=expected_prior_source,
                      direct_parent_sha=direct_parent_sha,
                  )
              except RecoveryContractError as exc:
                  raise SystemExit(str(exc)) from exc
              rollback_space_sha = expected_prior_space
              # Wrapper ancestry is not a runtime readback while the current Space is PAUSED.
              rollback_runtime_sha = ""
              rollback_source_sha = expected_prior_source
              rollback_stage = ""
              sync_parent_sha = topology.sync_parent_sha
              print(
                  f"validated paused forward recovery mode={topology.mode}, "
                  f"parent={sync_parent_sha}, paused_source={current_pin}, "
                  f"candidate={candidate_sha}"
              )
          else:
              deadline = time.monotonic() + 900
              while True:
                  runtime = api.get_space_runtime(repo_id=space_id)
                  stage = str(getattr(runtime.stage, "value", runtime.stage))
                  runtime_sha = str(runtime.raw.get("sha") or "")
                  current_repo_sha = str(
                      api.repo_info(repo_id=space_id, repo_type="space").sha
                  )
                  if current_repo_sha != prior_space_sha:
                      raise SystemExit(
                          "Space repository changed while capturing the rollback point: "
                          f"expected={prior_space_sha}, current={current_repo_sha}"
                      )

                  stage_upper = stage.upper()
                  stable = stage_upper.endswith("RUNNING") or stage_upper.endswith("SLEEPING")
                  if stable and runtime_sha == prior_space_sha:
                      break
                  if any(
                      marker in stage_upper
                      for marker in (
                          "PAUSED",
                          "BUILD_ERROR",
                          "RUNTIME_ERROR",
                          "CONFIG_ERROR",
                          "NO_APP_FILE",
                          "STOPPED",
                      )
                  ):
                      raise SystemExit(
                          "refusing to mutate a Space without a stable rollback runtime: "
                          f"stage={stage}, repo_sha={prior_space_sha}, "
                          f"runtime_sha={runtime_sha}"
                      )
                  if time.monotonic() >= deadline:
                      raise SystemExit(
                          "cannot establish rollback point before promotion: "
                          f"stage={stage}, repo_sha={prior_space_sha}, "
                          f"runtime_sha={runtime_sha}"
                      )
                  print(
                      f"rollback-point stage={stage}, repo_sha={prior_space_sha}, "
                      f"runtime_sha={runtime_sha}"
                  )
                  time.sleep(20)

              rollback_source_sha = source_pin(prior_space_sha)
              rollback_space_sha = prior_space_sha
              rollback_runtime_sha = runtime_sha
              rollback_stage = stage
              sync_parent_sha = prior_space_sha

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"prior_space_commit_sha={rollback_space_sha}\n")
              output.write(f"prior_runtime_commit_sha={rollback_runtime_sha}\n")
              output.write(f"prior_souwen_ref={rollback_source_sha}\n")
              output.write(f"prior_runtime_stage={rollback_stage}\n")
              output.write(f"sync_parent_sha={sync_parent_sha}\n")
          print(
              f"captured transaction context space={rollback_space_sha}, "
              f"runtime={rollback_runtime_sha}, stage={rollback_stage}, "
              f"source={rollback_source_sha}, parent={sync_parent_sha}"
          )
          PY

      - name: Preflight managed HFS Space Secret names
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: BlueSkyXN/SouWen
        run: |
          python -I - <<'PY'
          import os

          from huggingface_hub import HfApi
          from huggingface_hub.utils import build_hf_headers, get_session, hf_raise_for_status

          token = os.environ["HF_TOKEN"]
          space_id = os.environ["HF_SPACE_ID"]
          expected_names = {
              "SOUWEN_ADMIN_PASSWORD",
              "SOUWEN_CONFIG_B64",
              "UNIAPI_API_KEY",
          }
          api = HfApi(token=token)

          def read_secret_names() -> set[str]:
              response = get_session().get(
                  f"{api.endpoint}/api/spaces/{space_id}/secrets",
                  headers=build_hf_headers(token=token),
                  timeout=30.0,
              )
              hf_raise_for_status(response)
              payload = response.json()
              if not isinstance(payload, dict) or not all(
                  isinstance(name, str) for name in payload
              ):
                  raise SystemExit("Space Secret name readback returned an unexpected schema")
              return set(payload)

          existing_names = read_secret_names()
          unexpected_names = existing_names - expected_names
          if unexpected_names:
              raise SystemExit(
                  "refusing to modify Space settings with unregistered Secret names: "
                  + ", ".join(sorted(unexpected_names))
              )
          print("Managed Space Secret name preflight passed")
          PY

      - name: Probe selected HFS LLM Search Provider before mutation
        env:
          SOUWEN_CONFIG_B64: ${{ secrets.SOUWEN_CONFIG_B64 }}
          UNIAPI_API_KEY: ${{ secrets.UNIAPI_API_KEY }}
        run: python scripts/hf_space_llm_preflight.py --request-timeout 60

      - name: Recheck absent recovery tag and Release before mutation
        if: ${{ inputs.recovery_from_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          python -I - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          tag = f"v{os.environ['VERSION']}"

          def require_absent(path: str, label: str) -> None:
              request = Request(
                  f"https://api.github.com{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      json.load(response)
              except HTTPError as exc:
                  if exc.code == 404:
                      return
                  raise SystemExit(f"cannot prove absent {label}") from exc
              raise SystemExit(f"paused recovery requires absent {label}")

          require_absent(f"/repos/{repository}/git/ref/tags/{tag}", f"tag {tag}")
          require_absent(f"/repos/{repository}/releases/tags/{tag}", f"Release {tag}")
          print(f"confirmed absent recovery tag and Release for {tag}")
          PY

      - name: Write immutable HFS transaction intent
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          VERSION: ${{ inputs.version }}
          RECOVERY_FROM_RUN_ID: ${{ inputs.recovery_from_run_id }}
          EXPECTED_PAUSED_SPACE_SHA: ${{ inputs.expected_paused_space_sha }}
          EXPECTED_PAUSED_SOURCE_SHA: ${{ inputs.expected_paused_source_sha }}
          EXPECTED_FAILED_CANDIDATE_SHA: ${{ inputs.expected_failed_candidate_sha }}
          EXPECTED_PRIOR_SPACE_SHA: ${{ inputs.expected_prior_space_sha }}
          EXPECTED_PRIOR_SOURCE_SHA: ${{ inputs.expected_prior_source_sha }}
          PRIOR_SPACE_SHA: ${{ steps.prior.outputs.prior_space_commit_sha }}
          PRIOR_SOURCE_SHA: ${{ steps.prior.outputs.prior_souwen_ref }}
          SYNC_PARENT_SHA: ${{ steps.prior.outputs.sync_parent_sha }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          intent = {
              "schema": "souwen-hfs-transaction-intent-v1",
              "run_id": os.environ["RUN_ID"],
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "version": os.environ["VERSION"],
              "transaction_kind": (
                  "recovery" if os.environ["RECOVERY_FROM_RUN_ID"] else "release"
              ),
              "recovery_from_run_id": os.environ["RECOVERY_FROM_RUN_ID"],
              "expected_paused_space_sha": os.environ["EXPECTED_PAUSED_SPACE_SHA"],
              "expected_paused_source_sha": os.environ["EXPECTED_PAUSED_SOURCE_SHA"],
              "expected_failed_candidate_sha": os.environ[
                  "EXPECTED_FAILED_CANDIDATE_SHA"
              ],
              "expected_prior_space_sha": os.environ["EXPECTED_PRIOR_SPACE_SHA"],
              "expected_prior_source_sha": os.environ["EXPECTED_PRIOR_SOURCE_SHA"],
              "prior_space_sha": os.environ["PRIOR_SPACE_SHA"],
              "prior_source_sha": os.environ["PRIOR_SOURCE_SHA"],
              "sync_parent_sha": os.environ["SYNC_PARENT_SHA"],
          }
          Path("hfs-transaction-intent.json").write_text(
              json.dumps(intent, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(
              "recorded immutable HFS transaction intent for "
              f"run={intent['run_id']}, attempt={intent['run_attempt']}"
          )
          PY

      - name: Upload immutable HFS transaction intent before mutation
        uses: actions/upload-artifact@v7
        with:
          name: >-
            hfs-transaction-intent-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: hfs-transaction-intent.json
          if-no-files-found: error
          retention-days: 90

      - name: Mark settings mutation phase
        id: settings_mutation
        run: echo "settings_mutation_started=true" >> "$GITHUB_OUTPUT"

      - name: Sync managed HFS Space secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: BlueSkyXN/SouWen
          SOUWEN_ADMIN_PASSWORD: ${{ secrets.SOUWEN_SMOKE_BEARER_TOKEN }}
          SOUWEN_CONFIG_B64: ${{ secrets.SOUWEN_CONFIG_B64 }}
          UNIAPI_API_KEY: ${{ secrets.UNIAPI_API_KEY }}
        run: |
          python -I - <<'PY'
          import os

          from huggingface_hub import HfApi
          from huggingface_hub.utils import build_hf_headers, get_session, hf_raise_for_status

          token = os.environ["HF_TOKEN"]
          space_id = os.environ["HF_SPACE_ID"]
          managed = {
              "SOUWEN_ADMIN_PASSWORD": os.environ["SOUWEN_ADMIN_PASSWORD"],
              "SOUWEN_CONFIG_B64": os.environ["SOUWEN_CONFIG_B64"],
              "UNIAPI_API_KEY": os.environ["UNIAPI_API_KEY"],
          }
          expected_names = set(managed)
          api = HfApi(token=token)

          def read_secret_names() -> set[str]:
              response = get_session().get(
                  f"{api.endpoint}/api/spaces/{space_id}/secrets",
                  headers=build_hf_headers(token=token),
                  timeout=30.0,
              )
              hf_raise_for_status(response)
              payload = response.json()
              if not isinstance(payload, dict) or not all(
                  isinstance(name, str) for name in payload
              ):
                  raise SystemExit("Space Secret name readback returned an unexpected schema")
              return set(payload)

          for key, value in managed.items():
              api.add_space_secret(
                  repo_id=space_id,
                  key=key,
                  value=value,
                  description="Managed by the SouWen deployment transaction",
              )

          actual_names = read_secret_names()
          if actual_names != expected_names:
              missing = ", ".join(sorted(expected_names - actual_names)) or "none"
              extra = ", ".join(sorted(actual_names - expected_names)) or "none"
              raise SystemExit(
                  f"managed Space Secret name readback mismatch: missing={missing}; extra={extra}"
              )
          print("Managed Space Secret names: " + ", ".join(sorted(actual_names)))
          PY

      - name: Sync changed HFS wrapper files
        id: sync
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: BlueSkyXN/SouWen
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          PRIOR_SPACE_SHA: ${{ steps.prior.outputs.sync_parent_sha }}
        run: |
          python -I - <<'PY'
          import os
          import re
          import tempfile
          from pathlib import Path

          from huggingface_hub import CommitOperationAdd, HfApi, hf_hub_download
          from huggingface_hub.errors import EntryNotFoundError

          FILES = {
              "cloud/hfs/Dockerfile": "Dockerfile",
              "cloud/hfs/README.md": "README.md",
              "cloud/hfs/.dockerignore": ".dockerignore",
              "cloud/hfs/entrypoint.sh": "entrypoint.sh",
          }

          api = HfApi(token=os.environ["HF_TOKEN"])
          space_id = os.environ["HF_SPACE_ID"]
          prior_space_sha = os.environ["PRIOR_SPACE_SHA"]
          candidate_sha = os.environ["CANDIDATE_SHA"]
          if re.fullmatch(r"[0-9a-f]{40}", candidate_sha) is None:
              raise SystemExit("refusing to deploy a non-immutable candidate SHA")
          operations = []

          with tempfile.TemporaryDirectory() as tmpdir:
              tmp = Path(tmpdir)
              for local_name, remote_name in FILES.items():
                  local_path = Path(local_name)
                  local_bytes = local_path.read_bytes()
                  if remote_name == "Dockerfile":
                      marker = b"ARG SOUWEN_REF=0000000000000000000000000000000000000000"
                      if local_bytes.count(marker) != 1:
                          raise SystemExit("cloud/hfs/Dockerfile SOUWEN_REF marker changed")
                      local_bytes = local_bytes.replace(
                          marker,
                          f"ARG SOUWEN_REF={candidate_sha}".encode(),
                      )

                  try:
                      remote_path = hf_hub_download(
                          repo_id=space_id,
                          repo_type="space",
                          filename=remote_name,
                          revision=prior_space_sha,
                          token=os.environ["HF_TOKEN"],
                          local_dir=tmp / "download",
                          force_download=True,
                      )
                      remote_bytes = Path(remote_path).read_bytes()
                  except EntryNotFoundError:
                      remote_bytes = None

                  if remote_bytes != local_bytes:
                      operations.append(
                          CommitOperationAdd(
                              path_in_repo=remote_name,
                              path_or_fileobj=local_bytes,
                          )
                      )

          if operations:
              changed = ", ".join(op.path_in_repo for op in operations)
              print(f"Sync changed HFS wrapper files: {changed}")
              commit = api.create_commit(
                  repo_id=space_id,
                  repo_type="space",
                  operations=operations,
                  commit_message=f"Promote SouWen candidate {candidate_sha[:12]}",
                  parent_commit=prior_space_sha,
              )
              space_commit_sha = commit.oid
              promotion_changed = "true"
          else:
              print("No HFS wrapper file changes to sync.")
              current_sha = str(api.repo_info(repo_id=space_id, repo_type="space").sha)
              if current_sha != prior_space_sha:
                  raise SystemExit(
                      "Space repository changed after rollback snapshot: "
                      f"expected={prior_space_sha}, current={current_sha}"
                  )
              space_commit_sha = current_sha
              promotion_changed = "false"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"space_commit_sha={space_commit_sha}\n")
              output.write(f"promotion_changed={promotion_changed}\n")

          variables = api.add_space_variable(
              repo_id=space_id,
              key="SOUWEN_WRAPPER_SHA",
              value=space_commit_sha,
              description="Managed by the SouWen deployment transaction",
          )
          wrapper_variable = variables.get("SOUWEN_WRAPPER_SHA")
          if getattr(wrapper_variable, "value", None) != space_commit_sha:
              raise SystemExit("SOUWEN_WRAPPER_SHA variable readback mismatch")

          pinned_dockerfile = Path(
              hf_hub_download(
                  repo_id=space_id,
                  repo_type="space",
                  filename="Dockerfile",
                  revision=space_commit_sha,
                  token=os.environ["HF_TOKEN"],
                  force_download=True,
              )
          ).read_text(encoding="utf-8")
          expected_pin = f"ARG SOUWEN_REF={candidate_sha}"
          if pinned_dockerfile.splitlines().count(expected_pin) != 1:
              raise SystemExit(
                  f"Space commit {space_commit_sha} does not pin candidate source provenance"
              )
          print(f"Space commit {space_commit_sha} pins candidate {candidate_sha}")
          PY

  rebuild-space:
    name: Factory rebuild Space
    if: >-
      ${{
        needs.detect-changes.outputs.deploy_changed == 'true' &&
        inputs.deploy_hfs
      }}
    needs: [detect-changes, sync-hfs-wrapper]
    environment:
      name: hf
      url: https://huggingface.co/spaces/BlueSkyXN/SouWen
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub client
        run: python -m pip install "huggingface_hub>=1.8,<2"

      - name: Factory rebuild Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: BlueSkyXN/SouWen
          RECOVERY_FROM_RUN_ID: ${{ inputs.recovery_from_run_id }}
        run: |
          python -I - <<'PY'
          import os

          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space_id = os.environ["HF_SPACE_ID"]
          recovery = bool(os.environ.get("RECOVERY_FROM_RUN_ID"))
          if recovery:
              current = api.get_space_runtime(repo_id=space_id)
              stage = str(getattr(current.stage, "value", current.stage))
              if stage.upper() != "PAUSED":
                  raise SystemExit(
                      f"paused recovery must start from PAUSED; current stage={stage}"
                  )
          runtime = api.restart_space(
              repo_id=space_id,
              factory_reboot=True,
          )
          print(f"Requested factory rebuild for {space_id}; stage={runtime.stage}")
          PY

      - name: Wait for Space runtime
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: BlueSkyXN/SouWen
          EXPECTED_SPACE_SHA: ${{ needs.sync-hfs-wrapper.outputs.space_commit_sha }}
        run: |
          python -I - <<'PY'
          import os
          import time

          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space_id = os.environ["HF_SPACE_ID"]
          expected_sha = os.environ["EXPECTED_SPACE_SHA"]
          deadline = time.monotonic() + 900
          last_stage = "unknown"
          last_runtime_sha = "unknown"

          while time.monotonic() < deadline:
              runtime = api.get_space_runtime(repo_id=space_id)
              stage = getattr(runtime.stage, "value", runtime.stage)
              last_stage = str(stage)
              last_runtime_sha = str(runtime.raw.get("sha") or "unknown")
              repo_sha = str(api.repo_info(repo_id=space_id, repo_type="space").sha)
              print(
                  f"Space stage={last_stage}, repo_sha={repo_sha}, "
                  f"runtime_sha={last_runtime_sha}, expected={expected_sha}"
              )
              if (
                  last_stage.upper().endswith("RUNNING")
                  and repo_sha == expected_sha
                  and last_runtime_sha == expected_sha
              ):
                  print("Space repo and live runtime both match the promoted commit.")
                  break
              time.sleep(20)
          else:
              raise SystemExit(
                  "Space did not take over the promoted commit: "
                  f"stage={last_stage}, runtime_sha={last_runtime_sha}, expected={expected_sha}"
              )
          PY

  post-deploy-smoke:
    name: Post-deploy smoke matrix
    if: >-
      ${{
        needs.detect-changes.outputs.deploy_changed == 'true' &&
        inputs.deploy_hfs
      }}
    needs: [detect-changes, sync-hfs-wrapper, rebuild-space]
    environment:
      name: hf
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: surface
            args: "--surface-only"
            report: hf-space-cd-surface-report.md
            json: hf-space-cd-surface-report.json
            artifact: hf-space-cd-surface-report
          - mode: capability
            args: ""
            report: hf-space-cd-capability-report.md
            json: hf-space-cd-capability-report.json
            artifact: hf-space-cd-capability-report
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.verifier_sha }}
          persist-credentials: false
          path: trusted-verifier

      - name: Run ${{ matrix.mode }} post-deploy smoke
        env:
          EXPECTED_SOUWEN_VERSION: ${{ needs.sync-hfs-wrapper.outputs.version }}
          EXPECTED_SOUWEN_SOURCE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          EXPECTED_SOUWEN_WRAPPER_SHA: ${{ needs.sync-hfs-wrapper.outputs.space_commit_sha }}
          SOUWEN_HF_SPACE_URL: https://blueskyxn-souwen.hf.space
          SOUWEN_HF_SPACE_TOKEN: ${{ secrets.HF_SPACE_READ_TOKEN }}
          SOUWEN_SMOKE_REQUEST_TIMEOUT: "60"
          SOUWEN_SMOKE_WARP_MODES: auto
          SOUWEN_SMOKE_FAIL_ADMIN_OPEN: "1"
          SOUWEN_SMOKE_REPORT_FILE: ${{ github.workspace }}/${{ matrix.report }}
          SOUWEN_SMOKE_JSON_FILE: ${{ github.workspace }}/${{ matrix.json }}
          SOUWEN_SMOKE_BEARER_TOKEN: ${{ secrets.SOUWEN_SMOKE_BEARER_TOKEN }}
          SMOKE_ARGS: ${{ matrix.args }}
        run: |
          if [ -z "$SOUWEN_SMOKE_BEARER_TOKEN" ]; then
            echo "::error::SOUWEN_SMOKE_BEARER_TOKEN is required for candidate promotion"
            exit 1
          fi
          if [ -z "$SOUWEN_HF_SPACE_TOKEN" ]; then
            echo "::error::HF_SPACE_READ_TOKEN is required for private Space smoke"
            exit 1
          fi
          args=()
          if [ -n "$SMOKE_ARGS" ]; then
            args+=("$SMOKE_ARGS")
          fi
          args+=(--expected-wrapper-sha "$EXPECTED_SOUWEN_WRAPPER_SHA" --require-target-runtime)
          (
            cd trusted-verifier
            python scripts/hf_space_smoke.py "${args[@]}"
          )

      - name: Verify token admin and fail-closed admin access
        env:
          SOUWEN_HF_SPACE_URL: https://blueskyxn-souwen.hf.space
          HF_SPACE_READ_TOKEN: ${{ secrets.HF_SPACE_READ_TOKEN }}
          SOUWEN_SMOKE_BEARER_TOKEN: ${{ secrets.SOUWEN_SMOKE_BEARER_TOKEN }}
        run: |
          if [ -z "$HF_SPACE_READ_TOKEN" ] || [ -z "$SOUWEN_SMOKE_BEARER_TOKEN" ]; then
            echo "::error::Both HF_SPACE_READ_TOKEN and SOUWEN_SMOKE_BEARER_TOKEN are required"
            exit 1
          fi
          response="$(curl -fsS \
            -H "Authorization: Bearer $HF_SPACE_READ_TOKEN" \
            -H "X-SouWen-Token: $SOUWEN_SMOKE_BEARER_TOKEN" \
            "$SOUWEN_HF_SPACE_URL/api/v1/whoami")"
          jq -e '.role == "admin" and .admin_open == false' <<<"$response" >/dev/null

          unauth_body="$(mktemp)"
          unauth_status="$(curl -sS -o "$unauth_body" -w '%{http_code}' \
            -H "Authorization: Bearer $HF_SPACE_READ_TOKEN" \
            "$SOUWEN_HF_SPACE_URL/api/v1/whoami")"
          if [ "$unauth_status" = 401 ]; then
            exit 0
          fi
          test "$unauth_status" = 200
          jq -e '.role != "admin" and .admin_open != true' "$unauth_body" >/dev/null

      - name: Upload post-deploy test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.report }}
            ${{ matrix.json }}
          if-no-files-found: warn

  contain-space:
    name: Pause Space after failed settings-aware promotion
    needs: [sync-hfs-wrapper, rebuild-space, post-deploy-smoke]
    if: >-
      ${{
        always() &&
        inputs.deploy_hfs &&
        needs.sync-hfs-wrapper.outputs.prior_space_commit_sha != '' &&
        needs.sync-hfs-wrapper.outputs.settings_mutation_started == 'true' &&
        (
          needs.sync-hfs-wrapper.result != 'success' ||
          needs.rebuild-space.result != 'success' ||
          needs.post-deploy-smoke.result != 'success'
        )
      }}
    environment:
      name: hf
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub client
        run: python -m pip install "huggingface_hub>=1.8,<2"

      - name: Pause and verify Space runtime
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: BlueSkyXN/SouWen
        run: |
          python -I - <<'PY'
          import os
          import time
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN", "")
          if not token:
              raise SystemExit("HF_TOKEN is required to contain a failed promotion")
          api = HfApi(token=token)
          space_id = os.environ["HF_SPACE_ID"]
          api.pause_space(repo_id=space_id)
          deadline = time.monotonic() + 300
          last_stage = "unknown"
          while time.monotonic() < deadline:
              runtime = api.get_space_runtime(repo_id=space_id)
              last_stage = str(getattr(runtime.stage, "value", runtime.stage))
              print(f"containment stage={last_stage}")
              if "PAUSED" in last_stage.upper():
                  print(
                      f"Space {space_id} is paused after a failed promotion; "
                      "write-only Space Secret values require manual recovery"
                  )
                  break
              time.sleep(10)
          else:
              raise SystemExit(
                  f"Space containment could not be verified; last stage={last_stage}"
              )
          PY

  pause-space:
    name: Retry containment when the first pause cannot be proven
    needs: contain-space
    if: >-
      ${{
        always() &&
        inputs.deploy_hfs &&
        (
          needs.contain-space.result == 'failure' ||
          needs.contain-space.result == 'cancelled'
        )
      }}
    environment:
      name: hf
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub client
        run: python -m pip install "huggingface_hub>=1.8,<2"

      - name: Pause and verify Space runtime
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: BlueSkyXN/SouWen
        run: |
          python -I - <<'PY'
          import os
          import time

          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN", "")
          if not token:
              raise SystemExit("HF_TOKEN is required to pause a failed promotion")
          api = HfApi(token=token)
          space_id = os.environ["HF_SPACE_ID"]
          api.pause_space(repo_id=space_id)
          deadline = time.monotonic() + 300
          last_stage = "unknown"
          while time.monotonic() < deadline:
              runtime = api.get_space_runtime(repo_id=space_id)
              last_stage = str(getattr(runtime.stage, "value", runtime.stage))
              print(f"pause stage={last_stage}")
              if "PAUSED" in last_stage.upper():
                  print(f"Space {space_id} is paused after containment retry")
                  break
              time.sleep(10)
          else:
              raise SystemExit(f"Space pause could not be verified; last stage={last_stage}")
          PY

  transaction-receipt:
    name: Record HFS transaction outcome
    needs: [sync-hfs-wrapper, rebuild-space, post-deploy-smoke, contain-space, pause-space]
    if: ${{ always() && inputs.deploy_hfs }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write machine-readable transaction outcome
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          VERSION: ${{ inputs.version }}
          RECOVERY_FROM_RUN_ID: ${{ inputs.recovery_from_run_id }}
          EXPECTED_PAUSED_SPACE_SHA: ${{ inputs.expected_paused_space_sha }}
          EXPECTED_PAUSED_SOURCE_SHA: ${{ inputs.expected_paused_source_sha }}
          EXPECTED_FAILED_CANDIDATE_SHA: ${{ inputs.expected_failed_candidate_sha }}
          EXPECTED_PRIOR_SPACE_SHA: ${{ inputs.expected_prior_space_sha }}
          EXPECTED_PRIOR_SOURCE_SHA: ${{ inputs.expected_prior_source_sha }}
          PRIOR_SPACE_SHA: ${{ needs.sync-hfs-wrapper.outputs.prior_space_commit_sha }}
          PRIOR_SOURCE_SHA: ${{ needs.sync-hfs-wrapper.outputs.prior_souwen_ref }}
          SYNC_PARENT_SHA: ${{ needs.sync-hfs-wrapper.outputs.sync_parent_sha }}
          SPACE_COMMIT_SHA: ${{ needs.sync-hfs-wrapper.outputs.space_commit_sha }}
          SETTINGS_MUTATION_STARTED: ${{ needs.sync-hfs-wrapper.outputs.settings_mutation_started }}
          SYNC_RESULT: ${{ needs.sync-hfs-wrapper.result }}
          REBUILD_RESULT: ${{ needs.rebuild-space.result }}
          POST_DEPLOY_RESULT: ${{ needs.post-deploy-smoke.result }}
          CONTAIN_RESULT: ${{ needs.contain-space.result }}
          PAUSE_RESULT: ${{ needs.pause-space.result }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          outcome = {
              "schema": "souwen-hfs-transaction-outcome-v1",
              "run_id": os.environ["RUN_ID"],
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "version": os.environ["VERSION"],
              "transaction_kind": (
                  "recovery" if os.environ["RECOVERY_FROM_RUN_ID"] else "release"
              ),
              "recovery_from_run_id": os.environ["RECOVERY_FROM_RUN_ID"],
              "expected_paused_space_sha": os.environ["EXPECTED_PAUSED_SPACE_SHA"],
              "expected_paused_source_sha": os.environ["EXPECTED_PAUSED_SOURCE_SHA"],
              "expected_failed_candidate_sha": os.environ[
                  "EXPECTED_FAILED_CANDIDATE_SHA"
              ],
              "expected_prior_space_sha": os.environ["EXPECTED_PRIOR_SPACE_SHA"],
              "expected_prior_source_sha": os.environ["EXPECTED_PRIOR_SOURCE_SHA"],
              "prior_space_sha": os.environ["PRIOR_SPACE_SHA"],
              "prior_source_sha": os.environ["PRIOR_SOURCE_SHA"],
              "sync_parent_sha": os.environ["SYNC_PARENT_SHA"],
              "space_commit_sha": os.environ["SPACE_COMMIT_SHA"],
              "settings_mutation_started": (
                  os.environ["SETTINGS_MUTATION_STARTED"] == "true"
              ),
              "sync_result": os.environ["SYNC_RESULT"],
              "rebuild_result": os.environ["REBUILD_RESULT"],
              "post_deploy_result": os.environ["POST_DEPLOY_RESULT"],
              "contain_result": os.environ["CONTAIN_RESULT"],
              "pause_result": os.environ["PAUSE_RESULT"],
          }
          Path("hfs-transaction-outcome.json").write_text(
              json.dumps(outcome, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(
              "recorded HFS transaction outcome for "
              f"run={outcome['run_id']}, kind={outcome['transaction_kind']}"
          )
          PY

      - name: Upload HFS transaction outcome
        uses: actions/upload-artifact@v7
        with:
          name: hfs-transaction-outcome-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: hfs-transaction-outcome.json
          if-no-files-found: error
          retention-days: 90
